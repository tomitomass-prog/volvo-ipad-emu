name: ESP32-S3 Volvo iPod car test v1.3
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'esp32_s3_usb_volvo_test_v13/**'
      - 'tests/test_volvo_v13.c'
      - '.github/workflows/volvo_ipod_car_test_v13.yml'
jobs:
  build-volvo-v13:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test iAP parser and virtual song (host GCC)
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -I esp32_s3_usb_volvo_test_v13/main \
            tests/test_volvo_v13.c esp32_s3_usb_volvo_test_v13/main/iap_diag.c -o /tmp/test_volvo_v13
          /tmp/test_volvo_v13
      - name: Build ESP32-S3 (ESP-IDF v5.4.2)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.2
          target: esp32s3
          path: esp32_s3_usb_volvo_test_v13
          command: idf.py build
      - name: Verify binary files
        run: |
          p=esp32_s3_usb_volvo_test_v13/build
          test -s "$p/volvo_s3_volvo_test_v13.bin"
          test -s "$p/bootloader/bootloader.bin"
          test -s "$p/partition_table/partition-table.bin"
          test -s "$p/flasher_args.json"
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-volvo-ipod-car-test-v13
          if-no-files-found: error
          path: |
            esp32_s3_usb_volvo_test_v13/build/volvo_s3_volvo_test_v13.bin
            esp32_s3_usb_volvo_test_v13/build/bootloader/bootloader.bin
            esp32_s3_usb_volvo_test_v13/build/partition_table/partition-table.bin
            esp32_s3_usb_volvo_test_v13/build/flasher_args.json
            esp32_s3_usb_volvo_test_v13/build/flash_args
