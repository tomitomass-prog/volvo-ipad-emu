name: ESP32-S3 Zero - USB Audio 1.0 + HID diagnostic v1.0
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'esp32_s3_usb_uac1_hid_diag_v10/**'
      - '.github/workflows/diagnostic_s3_uac1_hid_v10.yml'
jobs:
  build-s3-uac1-hid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build ESP32-S3 diagnostic (ESP-IDF v5.4.2)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.2
          target: esp32s3
          path: esp32_s3_usb_uac1_hid_diag_v10
          command: idf.py build
      - name: Validate firmware outputs
        shell: bash
        run: |
          set -euo pipefail
          p=esp32_s3_usb_uac1_hid_diag_v10/build
          test -s "$p/volvo_s3_uac1_hid_diag_v10.bin"
          test -s "$p/bootloader/bootloader.bin"
          test -s "$p/partition_table/partition-table.bin"
          test -s "$p/flasher_args.json"
      - name: Publish diagnostic firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-uac1-hid-diagnostic-v10
          if-no-files-found: error
          path: |
            esp32_s3_usb_uac1_hid_diag_v10/build/volvo_s3_uac1_hid_diag_v10.bin
            esp32_s3_usb_uac1_hid_diag_v10/build/bootloader/bootloader.bin
            esp32_s3_usb_uac1_hid_diag_v10/build/partition_table/partition-table.bin
            esp32_s3_usb_uac1_hid_diag_v10/build/flasher_args.json
            esp32_s3_usb_uac1_hid_diag_v10/build/flash_args
