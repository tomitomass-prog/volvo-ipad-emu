name: ESP32-S3 Zero - USB HID diagnostic v0.7

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'esp32_s3_usb_diag/**'
      - '.github/workflows/diagnostic_s3_hid.yml'

jobs:
  build-s3-hid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build diagnostic firmware using ESP-IDF 5.1.2
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.1.2
          target: esp32s3
          path: esp32_s3_usb_diag
          command: idf.py build

      - name: Check firmware files
        shell: bash
        run: |
          set -euo pipefail
          test -s esp32_s3_usb_diag/build/volvo_s3_hid_diag.bin
          test -s esp32_s3_usb_diag/build/bootloader/bootloader.bin
          test -s esp32_s3_usb_diag/build/partition_table/partition-table.bin
          test -s esp32_s3_usb_diag/build/flasher_args.json

      - name: Upload ESP32-S3 HID diagnostic firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-hid-diagnostic-v07
          if-no-files-found: error
          path: |
            esp32_s3_usb_diag/build/volvo_s3_hid_diag.bin
            esp32_s3_usb_diag/build/bootloader/bootloader.bin
            esp32_s3_usb_diag/build/partition_table/partition-table.bin
            esp32_s3_usb_diag/build/flasher_args.json
            esp32_s3_usb_diag/build/flash_args
