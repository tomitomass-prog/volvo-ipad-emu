name: ESP32-S3 Zero - USB Audio + HID diagnostic v0.9

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'esp32_s3_usb_audio_hid_diag_v09/**'
      - '.github/workflows/diagnostic_s3_audio_hid_v09.yml'

jobs:
  build-s3-audio-hid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build diagnostic firmware ESP-IDF 5.1.2
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.1.2
          target: esp32s3
          path: esp32_s3_usb_audio_hid_diag_v09
          command: idf.py build
      - name: Check BIN and flash addresses
        shell: bash
        run: |
          set -euo pipefail
          p=esp32_s3_usb_audio_hid_diag_v09/build
          test -s "$p/volvo_s3_audio_hid_diag_v09.bin"
          test -s "$p/bootloader/bootloader.bin"
          test -s "$p/partition_table/partition-table.bin"
          test -s "$p/flasher_args.json"
      - name: Publish firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-audio-hid-diagnostic-v09
          if-no-files-found: error
          path: |
            esp32_s3_usb_audio_hid_diag_v09/build/volvo_s3_audio_hid_diag_v09.bin
            esp32_s3_usb_audio_hid_diag_v09/build/bootloader/bootloader.bin
            esp32_s3_usb_audio_hid_diag_v09/build/partition_table/partition-table.bin
            esp32_s3_usb_audio_hid_diag_v09/build/flasher_args.json
            esp32_s3_usb_audio_hid_diag_v09/build/flash_args
